<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mimo</title>
<meta name="description" content="Cuida a Mimo cepillándote los dientes y bebiendo agua.">
<meta name="theme-color" content="#15112e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--card:#262050;--acc:#7dd3a0;--gold:#f5c542;--blue:#6ab4ff;--red:#ef6f6c;--txt:#f4f1ff;--mut:#a59ec9;--nav:#15112e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 0%,#2e2766,#120e24 60%);color:var(--txt);overflow:hidden}
#top{position:fixed;top:0;left:0;right:0;height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:12px;justify-content:space-between;background:rgba(18,14,36,.88);backdrop-filter:blur(8px);z-index:5;font-size:14px}
#top .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.xpbar{flex:1;height:8px;background:#0c0920;border-radius:99px;overflow:hidden}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--blue));transition:width .5s}
#main{position:fixed;top:calc(56px + env(safe-area-inset-top));bottom:calc(72px + env(safe-area-inset-bottom));left:0;right:0;overflow-y:auto;padding:14px 16px 24px}
nav{position:fixed;bottom:0;left:0;right:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--nav);border-top:1px solid #2c2657;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;z-index:5}
nav button{background:none;border:0;color:var(--mut);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:8px 0 10px}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--txt)}
nav button.center .disc{width:62px;height:62px;border-radius:50%;background:linear-gradient(160deg,#9b8dff,#4b3fb5);display:grid;place-items:center;font-size:30px;margin-top:-34px;box-shadow:0 6px 18px #0009;border:4px solid var(--nav)}
nav button.center.on .disc{box-shadow:0 0 0 3px var(--acc),0 6px 18px #0009}
h2{font-size:15px;margin:18px 2px 8px;color:var(--mut);font-weight:600}
h2:first-child{margin-top:4px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px}
.label{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:8px}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:6px;gap:8px}
.mut{color:var(--mut)}
.small{font-size:12px}
.c{text-align:center}
.bar{height:10px;background:#130f26;border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--acc);transition:width .4s}
.bar.big{height:16px}
.stage{display:grid;place-items:center;height:210px;border-radius:26px;background:radial-gradient(circle at 50% 60%,#4a3ea0,#1d1838 70%);margin-bottom:10px;position:relative}
.stage .tag{position:absolute;top:12px;left:14px;font-size:12px;color:var(--mut)}
.pet{line-height:0;animation:bob 2.6s ease-in-out infinite}
.pet svg{width:160px;height:160px;display:block}
.disc svg{width:46px;height:46px;display:block}
.pet.glow{filter:drop-shadow(0 0 18px #f5c542aa)}
.pet.sad{filter:grayscale(.7) brightness(.8);animation:none;transform:translateY(10px) rotate(-6deg)}
.pet.sm{animation:none;width:72px}
.pet.sm svg{width:72px;height:72px}
/* Pantalla de Mimo: ocupa todo el alto disponible sin scroll */
#main.fill{display:flex;flex-direction:column;gap:12px}
#main.fill>*{margin:0;flex:none}
#main.fill .stage{flex:1 1 auto;min-height:120px;height:auto}
#main.fill .stage .pet svg{width:min(62vw,24vh,320px);height:min(62vw,24vh,320px)}
#main.fill .mood{margin:0;min-height:0}
#main.fill .card{padding:18px}
#main.fill button.big{padding:18px 4px;font-size:15px}
#main.fill button.big span{font-size:32px}
#main.fill .glass{height:44px}
#main.fill button.sm{padding:14px}
#main.fill>.grow{flex:1 1 auto}
#main.fill h2{margin:4px 2px -4px}
.qlist{display:flex;flex-direction:column;gap:8px;min-height:0}
.qlist .quest{flex:1 1 0;margin:0;min-height:48px;padding:6px 12px}
.stage .boss-art{font-size:min(20vh,44vw);margin:0;line-height:1}
.chart{display:flex;flex-direction:column;min-height:200px}
.chart .cols{flex:1;height:auto}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mini{text-align:center;padding:14px 6px;margin:0}
.mini b{display:block;font-size:24px;margin-bottom:2px}
.mini span{font-size:12px;color:var(--mut)}
.stats{display:flex;flex-direction:column;justify-content:space-evenly;padding-top:8px;padding-bottom:8px}
#main.fill .stat{padding:8px 0}
@keyframes bob{50%{transform:translateY(-8px)}}
@media (prefers-reduced-motion:reduce){.pet{animation:none}}
.mood{text-align:center;color:var(--gold);font-size:14px;margin:4px 0 14px;min-height:20px;line-height:1.4}
.mood.bad{color:var(--red)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
button.big{background:#2f2956;color:var(--txt);border:2px solid transparent;border-radius:18px;padding:14px 4px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
button.big span{font-size:28px}
button.big small{font-size:11px;color:var(--mut);font-weight:400}
button.big.done{border-color:var(--acc)}
button.big.done small{color:var(--acc)}
button.big.open{border-color:var(--gold)}
button.big.open small{color:var(--gold)}
button.big.soon{opacity:.55}
button.big.lost{opacity:.55;border-color:#5a2f46}
button.big.lost small{color:var(--red)}
button.big:active,button.sm:active{transform:scale(.98)}
.water{display:flex;gap:5px;margin:12px 0}
.glass{flex:1;height:34px;border:2px solid var(--blue);border-radius:0 0 8px 8px;position:relative;overflow:hidden}
.glass.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:100%;background:var(--blue);opacity:.85}
.btns{display:flex;gap:8px}
button.sm{flex:1;background:#3a3370;color:var(--txt);border:0;border-radius:12px;padding:11px;font:inherit;cursor:pointer}
button.sm.pri{background:var(--blue);color:#0c1b33;font-weight:600;flex:2}
button.sm.wait{background:#2b3a55;color:var(--mut);font-weight:400}
.quest{display:flex;align-items:center;gap:12px;width:100%;background:#2f2956;border:2px solid transparent;color:inherit;border-radius:16px;padding:14px;margin-bottom:10px;font:inherit;text-align:left;cursor:pointer}
.quest.static{cursor:default}
.quest.done{border-color:var(--acc)}
.quest.open{border-color:var(--gold)}
.quest.soon,.quest.lost{opacity:.6}
.qi{font-size:26px}
.qt{flex:1}
.qt small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.quest.lost .qt small{color:var(--red)}
.rw{font-size:12px;color:var(--gold);white-space:nowrap}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;font-size:13px;flex:none}
.quest.done .check{background:var(--acc);border-color:var(--acc);color:#10231a}
.quest.lost .check{border-color:var(--red);color:var(--red)}
.boss-art{font-size:96px;text-align:center;margin:6px 0;animation:bob 3s ease-in-out infinite}
.day{display:flex;align-items:center;gap:10px;font-size:13px;margin:8px 0}
.day span:first-child{width:14px;color:var(--mut)}
.day span:last-child{width:34px;text-align:right}
.dbar{flex:1;height:10px;background:#130f26;border-radius:99px;overflow:hidden}
.dbar>i{display:block;height:100%;background:var(--red)}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mut);gap:4px}
.col .b{width:100%;background:linear-gradient(180deg,var(--acc),#3d7f5f);border-radius:8px 8px 4px 4px;min-height:4px}
.col.cur .b{background:linear-gradient(180deg,var(--gold),#9a7a1c)}
.col b{color:var(--txt);font-size:12px}
.badges span{display:inline-block;border-radius:99px;padding:5px 11px;font-size:12px;margin:3px;background:#3a3370}
.badges span.off{opacity:.35}
.stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #332d5c;font-size:14px}
.stat:last-child{border:0}
.prof{display:flex;align-items:center;gap:14px}
.pname{font-size:18px;font-weight:700;line-height:1.25;word-break:break-word}
button.danger{width:100%;background:transparent;color:var(--red);border:2px solid var(--red);border-radius:14px;padding:12px;font:inherit;cursor:pointer}
.toast{background:var(--gold);color:#2a2100;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;text-align:center;margin-bottom:12px;animation:pop .3s ease-out}
.toast.warn{background:#3a3370;color:var(--txt)}
@keyframes pop{from{transform:translateY(-6px);opacity:0}}
.note{font-size:12px;color:var(--mut);text-align:center;margin-top:14px;line-height:1.5}
.rules{font-size:13px;color:var(--mut);line-height:1.6;margin:0;padding-left:18px}
#login{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 30%,#3a2f86,#120e24 65%);display:flex;align-items:center;justify-content:center;padding:24px}
#login[hidden]{display:none}
.login-box{width:100%;max-width:340px;text-align:center}
.login-box .pet{display:inline-block}
.login-box .pet svg{width:150px;height:150px}
.login-box h1{font-size:40px;margin:6px 0 4px;letter-spacing:.5px}
.login-box p{color:var(--mut);margin:0 0 26px;line-height:1.5}
button.auth{width:100%;border:0;border-radius:14px;padding:15px;font:inherit;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer}
button.auth.google{background:#fff;color:#1f1f1f}
button.auth.apple{background:#000;color:#fff;border:1px solid #3a3a3a}
button.auth:disabled{opacity:.6}
.login-err{margin-top:16px;color:var(--red);font-size:14px;line-height:1.4}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.acct b{display:block;font-size:14px;word-break:break-all}
.sync{font-size:12px;color:var(--mut)}
.sync.ok{color:var(--acc)}
.sync.error{color:var(--red)}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns2 button{width:100%;padding:12px;border-radius:14px;font:inherit;cursor:pointer}
.btn-out{background:#3a3370;color:var(--txt);border:0}
.statgrid{grid-auto-rows:1fr;align-content:stretch}
.ask-pet{display:inline-block;animation:none}
.ask-pet.sad{filter:grayscale(.6) brightness(.85)}
.sumlist{background:#1d1840;border-radius:14px;padding:4px 12px;margin-top:4px}
.sumlist div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #332d5c;font-size:14px}
.sumlist div:last-child{border:0}
.sumlist span{color:var(--mut);flex:none}
.sumlist b{text-align:right;font-weight:600}
.ev{border-radius:12px;padding:9px 12px;margin:0 0 8px;font-size:14px;line-height:1.4}
.ev.good{background:#1f4a3a;color:#c9f5df}
.ev.bad{background:#4a1f2e;color:#ffd0d6}
.missing{color:var(--gold);margin:10px 2px 0;line-height:1.4}
.ask-pet svg{width:110px;height:110px}
.sheet .c h3{margin:6px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#1b1640;border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-size:14px;padding:9px;border-radius:10px;cursor:pointer}
.seg button.on{background:#3a3370;color:var(--txt);font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;border:1px solid #3a3370;background:none;color:var(--mut);font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;cursor:pointer}
.chips button.on{background:#3a3370;color:var(--txt)}
.gh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.gh b{display:block;font-size:16px}
.codebtn{border:0;background:var(--gold);color:#2a2100;font:inherit;font-weight:700;letter-spacing:1.5px;padding:9px 12px;border-radius:12px;cursor:pointer;flex:none}
.rlist{overflow-y:auto;padding:6px 10px;min-height:160px}
.rrow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #332d5c}
.rrow:last-child{border:0}
.rrow.me{background:#3a337066;border-radius:12px;border-bottom-color:transparent}
.pos{width:26px;text-align:center;font-weight:700;color:var(--mut);font-size:16px;flex:none}
.rpet svg{width:40px;height:40px;display:block}
.rname{flex:1;min-width:0}
.rname b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname i{font-style:normal;color:var(--mut);font-weight:400}
.rname small{display:block;font-size:11px;color:var(--mut)}
.rxp{font-weight:700;font-size:17px;color:var(--gold);text-align:right;flex:none}
.rxp small{display:block;font-size:10px;color:var(--mut);font-weight:400}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btns3 button{padding:12px 6px;border-radius:14px;font:inherit;font-size:14px;cursor:pointer}
.btns3 .leave{background:transparent;color:var(--red);border:1px solid #5a2f46}
.field.code{text-align:center;letter-spacing:6px;font-weight:700;text-transform:uppercase}
.statgrid .mini{display:flex;flex-direction:column;justify-content:center;padding:8px 4px}
.statgrid .mini b{font-size:20px}
#main.fill .prof{padding:12px 16px}
#main.fill .badges{padding:10px 12px;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:6px}
#main.fill .badges span{flex:none;margin:0}
#main.fill .acct{padding:12px 16px}
.qlist .quest.open{border-color:#5a4fa0}
/* Cuadrícula de misiones en la pantalla de Mimo */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.tile{background:#2f2956;border:2px solid transparent;border-radius:16px;padding:9px 4px;color:var(--txt);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;min-height:74px}
.tile .ti{font-size:26px;line-height:1.15}
.tile b{font-size:13px;line-height:1.2;text-align:center}
.tile small{font-size:11px;color:var(--mut);white-space:nowrap}
.tile.done{border-color:var(--acc)}
.tile.done small{color:var(--acc)}
.tile.open small{color:var(--gold)}
.tile.wait small{color:var(--blue)}
.tile.soon,.tile.lost{opacity:.5}
.tile.lost small{color:var(--red)}
.tile:active{transform:scale(.97)}
.quest.wait{border-color:#2f4f7a}
/* Ventanas */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:15}
#modal.open{display:flex}
.sheet{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:420px;max-height:85vh;overflow-y:auto;animation:pop .2s ease-out}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 12px}
.field{width:100%;background:#130f26;color:var(--txt);border:1px solid #3a3370;border-radius:12px;padding:12px;font:inherit;font-size:20px;margin-bottom:12px}
.sm-field{width:110px;font-size:16px;padding:8px 10px;margin:0;text-align:right;flex:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 2px;border-bottom:1px solid #332d5c;font-size:14px}
.opt input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.hrow{display:flex;justify-content:space-between;align-items:center}
button.link{background:none;border:0;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:4px}
.mini-btns{display:flex;gap:6px}
.mini-btns button{width:34px;height:34px;border-radius:10px;border:0;background:#3a3370;color:var(--txt);font-size:18px;cursor:pointer}
.mini-btns button:last-child{background:var(--blue);color:#0c1b33}
.sep{font-size:12px;color:var(--mut);margin:2px 4px -4px;text-transform:uppercase;letter-spacing:.6px}
.perfect{font-size:13px;color:var(--mut);padding:12px 16px}
.perfect b{color:var(--gold)}
.perfect.ok{border:2px solid var(--acc)}
button.setbtn{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;color:var(--txt);font:inherit;font-size:14px;cursor:pointer;padding:14px 16px;text-align:left}
</style>
</head>
<body>
<div id="top"></div>
<div id="main"></div>
<nav id="nav"></nav>
<div id="login" hidden></div>
<div id="modal" onclick="closeModal()"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
/* ---------- configuración ---------- */
const WATER_GOAL = 2000, GLASS = 250, MAX_GLASSES = 16, GLASSES_GOAL = WATER_GOAL / GLASS;
const COOLDOWN_MIN = 30;                 // minutos entre vasos de agua
const READ_MIN = 20;                     // minutos de lectura
const XP_GLASS = 5, DMG_GLASS = 5;       // por vaso
const XP_PERFECT = 20, XP_BOSS = 50;
const STAGE_XP = 150;                    // XP de Mimo para evolucionar
const ENERGY_DAY_MAX = 40;               // energía que quita un día sin hacer nada
const ENERGY_UP = 10;                    // energía que da un día perfecto
const ENERGY_GOOD = 5;                   // energía que da un día con el 80 % o más
const ENERGY_WEEKLY = 15;                // energía que quita una misión semanal sin hacer
const DAY_START = 3;                     // el día termina a las 3:00

/* Catálogo de hábitos.
   kind: brush/check (marcar, con franja opcional), water, steps, read, weekly */
const HABITS = [
  {id:'am',      kind:'brush',  icon:'🪥', name:'Dientes mañana',   full:'Lavarme los dientes por la mañana', from:6,  to:12, xp:10, dmg:10},
  {id:'md',      kind:'brush',  icon:'🪥', name:'Dientes mediodía', full:'Lavarme los dientes al mediodía',   from:14, to:17, xp:10, dmg:10},
  {id:'pm',      kind:'brush',  icon:'🪥', name:'Dientes noche',    full:'Lavarme los dientes por la noche',  from:20, to:27, xp:10, dmg:10},
  {id:'water',   kind:'water',  icon:'💧', name:'Beber agua',       full:'Beber 2 L de agua'},
  {id:'steps',   kind:'steps',  icon:'👟', name:'Caminar',          full:'Caminar mis pasos del día',         xp:20, dmg:20},
  {id:'read',    kind:'check',  icon:'📖', name:'Leer 20 min',      full:'Leer 20 minutos',                   xp:20, dmg:20},
  {id:'bed',     kind:'check',  icon:'🛏️', name:'Hacer la cama',    full:'Hacer la cama',                     xp:10, dmg:10},
  {id:'kitchen', kind:'check',  icon:'🍽️', name:'Ordenar cocina',   full:'Ordenar la cocina y el comedor',    xp:10, dmg:10},
  {id:'bath',    kind:'weekly', icon:'🛁', name:'Fregar baño',      full:'Fregar el baño',                    xp:30, dmg:30}
];
const H = Object.fromEntries(HABITS.map(h => [h.id, h]));
const GROUPS = [
  {key:'brush',   icon:'🪥', name:'Cepillarme los dientes (3 veces)'},
  {key:'water',   icon:'💧', name:'Beber 2 L de agua'},
  {key:'steps',   icon:'👟', name:'Caminar (objetivo de pasos)'},
  {key:'read',    icon:'📖', name:'Leer 20 minutos'},
  {key:'bed',     icon:'🛏️', name:'Hacer la cama'},
  {key:'kitchen', icon:'🍽️', name:'Ordenar cocina y comedor'},
  {key:'bath',    icon:'🛁', name:'Fregar el baño (semanal)'}
];
const LEGACY_H = ['am','md','pm','water'];   // días guardados antes de los nuevos hábitos
const DEFAULT_SETTINGS = { on:{brush:true, water:true, steps:true, read:true, bed:true, kitchen:true, bath:true}, stepGoal:8000 };
const PERFECT_MSG = '🌟 ¡Día perfecto! Mimo brilla de felicidad.';

const STAGES = ['Huevo','Bebé Mimo','Mimo pequeño','Mimo','Mimo alado','Mimo real'];
const PETS = STAGES;

/* ---------- Mimo (dibujado en SVG) ---------- */
function mimoSVG(stage, mood){
  const ink = '#2a2240';
  const eyes = (ey, dx) => {
    if (mood === 'happy') return `<path d="M${60-dx-5} ${ey+1} Q${60-dx} ${ey-5} ${60-dx+5} ${ey+1}M${60+dx-5} ${ey+1} Q${60+dx} ${ey-5} ${60+dx+5} ${ey+1}" stroke="${ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`;

  const mouth = my => {

  s += `<ellipse cx="60" cy="${cy}" rx="${rx}" ry="${ry}" fill="${body}"/><ellipse cx="60" cy="${cy+ry*0.35}" rx="${rx*0.6}" ry="${ry*0.5}" fill="${belly}"/>`;
  if (stage >= 3) s += `<ellipse cx="${60-rx+1}" cy="${cy+6}" rx="6" ry="10" fill="${dark}" transform="rotate(20 ${60-rx+1} ${cy+6})"/><ellipse cx="${60+rx-1}" cy="${cy+6}" rx="6" ry="10" fill="${dark}" transform="rotate(-20 ${60+rx-1} ${cy+6})"/>`;
  if (stage === 5) s += `<path d="M46 ${top+3} L48 ${top-11} L54 ${top-3} L60 ${top-14} L66 ${top-3} L72 ${top-11} L74 ${top+3} Z" fill="#f5c542"/>`;
  const ey = cy - ry*0.2, dx = rx*0.36;

const STORE = 'cuidadores-v3';
const TABS = [
  {id:'missions', icon:'📜', label:'Misiones'},
  {id:'boss',     icon:'🐉', label:'Jefe'},
  {id:'char',     icon:'',   label:'Mimo', center:true},
  {id:'rank',     icon:'🏆', label:'Ranking'},
  {id:'profile',  icon:'👤', label:'Perfil'}
];
let tab = 'char', confirmReset = false, mem = null;

/* ---------- fechas (el día lógico va de 3:00 a 3:00) ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function keyOf(dt){ return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate()); }
function parseKey(k){ const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(dt,n){ const r=new Date(dt); r.setDate(r.getDate()+n); return r; }

function todayKey(){ return keyOf(logicalNow()); }
function weekKeyOf(dt){ return keyOf(addDays(dt,-((dt.getDay()+6)%7))); }
function nowHour(){ const n=new Date(); let h=n.getHours()+n.getMinutes()/60; if (h < DAY_START) h += 24; return h; }
function fmtH(h){ return pad(h%24)+':00'; }
function fmtNum(n){ return Number(n || 0).toLocaleString('es-ES'); }
function fmtK(n){ n = n || 0; return n >= 1000 ? (Math.round(n/100)/10).toString().replace('.', ',') + 'k' : String(n); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ---------- almacenamiento ---------- */
function load(){
  try { const s = localStorage.getItem(STORE); if (s) return JSON.parse(s); } catch(e) {}
  return mem || { name:'Jugador', days:{}, bossDefeated:{}, bestStreak:0 };
}
function save(d){
  mem = d;
  try { localStorage.setItem(STORE, JSON.stringify(d)); } catch(e) {}
}

/* ---------- ajustes y hábitos activos ---------- */
function settingsOf(d){
  const s = d.settings || {};
  return { on: Object.assign({}, DEFAULT_SETTINGS.on, s.on || {}), stepGoal: s.stepGoal || DEFAULT_SETTINGS.stepGoal,
           notify: Object.assign({ on:false, deadline:true, hour:22 }, s.notify || {}), tz: s.tz };
}
function groupOf(h){ return h.kind === 'brush' ? 'brush' : h.id; }
function activeIds(s){ return HABITS.filter(h => s.on[groupOf(h)] !== false).map(h => h.id); }

/* ---------- registros del día ---------- */
function newRec(d){ const s = settingsOf(d); return { glasses:[], h:activeIds(s), sg:s.stepGoal }; }

}
/* Un día de hoy guardado antes de los nuevos hábitos se pasa a los hábitos activos */
function ensureToday(d){

}
function hList(r){ return r.h || LEGACY_H; }

function isDone(id, r){

  switch (h.kind) {
    case 'water': return glassCount(r) >= GLASSES_GOAL;
    case 'steps': return (r.steps || 0) >= (r.sg || DEFAULT_SETTINGS.stepGoal);
    default:      return !!r[id];

}
function doneDaily(r){ return dailyIds(r).filter(id => isDone(id, r)).length; }
function complete(r){ const n = dailyIds(r).length; return n > 0 && doneDaily(r) === n; }
function missingDaily(r){ return dailyIds(r).length - doneDaily(r); }
function habitPoints(id, r, field){
  if (H[id].kind === 'water') return Math.min(glassCount(r), GLASSES_GOAL) * (field === 'xp' ? XP_GLASS : DMG_GLASS);

}
function dayXP(r){

  if (complete(r)) x += XP_PERFECT;
  for (const id of weeklyIds(r)) if (r[id]) x += H[id].xp;

}
function dayDmg(r){
  let x = dailyIds(r).reduce((s, id) => s + habitPoints(id, r, 'dmg'), 0);

}
function habitMaxDmg(id){ return H[id].kind === 'water' ? GLASSES_GOAL * DMG_GLASS : H[id].dmg; }
function dailyMaxDmg(d){ return activeIds(settingsOf(d)).filter(id => H[id].kind !== 'weekly').reduce((s, id) => s + habitMaxDmg(id), 0); }
function bossHP(d){
  const ids = activeIds(settingsOf(d));

function weekDone(d, wk, id){
  const mon = parseKey(wk);

}
function mState(h, r){
  if (r[h.id]) return 'done';
  if (h.from === undefined) return 'open';
  const t = nowHour();
  if (t < h.from) return 'soon';

  return 'open';
}
function cooldownLeft(r){

function totalXP(d){

}

  let dt = logicalNow();
  if (!complete(rec(d, keyOf(dt)))) dt = addDays(dt,-1);

  while (d.days[keyOf(dt)] && complete(d.days[keyOf(dt)])) { n++; dt = addDays(dt,-1); }
  return n;
}
function weekDays(wk){ const mon = parseKey(wk); return Array.from({length:7}, (_, i) => keyOf(addDays(mon, i))); }

function checkBoss(d){
  const wk = weekKeyOf(logicalNow());
  if (!d.bossDefeated[wk] && weekDmg(d, wk) >= bossHP(d)) { d.bossDefeated[wk] = true; return true; }
  return false;
}

/* Cambio de energía al acabar un día según la parte de misiones completada:
   100 % → +10 · 80 % o más → +5 · 50–80 % → 0 · menos del 50 % → baja hasta −40 (nada hecho). */
function energyDelta(done, total){
  if (!total) return 0;
  const r = done / total;
  if (r >= 1) return ENERGY_UP;
  if (r >= 0.8) return ENERGY_GOOD;
  if (r >= 0.5) return 0;
  return -Math.round(ENERGY_DAY_MAX * (0.5 - r) / 0.5);
}

/* Recorre los días desde el primero: Mimo evoluciona con XP y pierde energía
   según la parte de misiones que falte cada día. Si llega a 0, baja de etapa. */
function simulate(d, tk = todayKey(), withTkXP = true){
  const keys = Object.keys(d.days).sort();
  let stage = 0, prog = 0, energy = 100, drops = 0, lastDrop = null;
  if (!keys.length) return {stage, prog, energy, drops, lastDrop};
  let dt = parseKey(keys[0]);
  while (keyOf(dt) <= tk){
    const k = keyOf(dt), r = rec(d, k);
    prog += (d.days[k] && (k < tk || withTkXP)) ? dayXP(r) : 0;
    while (prog >= STAGE_XP && stage < PETS.length-1){ stage++; prog -= STAGE_XP; }
    if (stage === PETS.length-1) prog = Math.min(prog, STAGE_XP);
    if (k < tk){
      energy += energyDelta(doneDaily(r), dailyIds(r).length);
      if (dt.getDay() === 0) {
        for (const id of weeklyIds(r)) if (!weekDone(d, weekKeyOf(dt), id)) energy -= ENERGY_WEEKLY;
      }
      energy = Math.min(100, energy);
      if (energy <= 0){
        if (stage > 0) stage--;
        prog = 0; energy = 50; drops++; lastDrop = k;
      }
    }
    dt = addDays(dt, 1);
  }
  return {stage, prog, energy, drops, lastDrop};
}

/* ---------- acciones ---------- */
function update(fn){
  const d = load();
  const res = fn(d);
  if (res === false) return;
  let msg = res || '';
  const td = d.days[todayKey()];
  if (td) td.u = Date.now();
  d.bestStreak = Math.max(d.bestStreak || 0, streak(d));
  if (checkBoss(d)) msg = '⚔️ ¡Dragón de la Placa derrotado! +' + XP_BOSS + ' XP';
  save(d);
  render(msg);
  schedulePush();
}
function act(id){
  const h = H[id];
  if (h.kind === 'water')  return addGlass();
  if (h.kind === 'steps')  return openSteps();
  if (h.kind === 'read')   return readAction();
  if (h.kind === 'weekly') return toggleWeekly(id);
  return toggle(id);
}
function toggle(id){
  const h = H[id];
  const st = mState(h, rec(load(), todayKey()));
  if (st === 'soon') { render('⏰ ' + h.full + ': se abre a las ' + fmtH(h.from), true); return; }
  if (st === 'lost') { render('❌ La franja de «' + h.full.toLowerCase() + '» ya ha pasado', true); return; }
  update(d => {
    const t = today(d), was = complete(t);
    t[id] = !t[id];
    if (!was && complete(t)) return PERFECT_MSG;
    return t[id] ? '✅ ¡Misión completada!' : 'Misión desmarcada';
  });
}
function toggleWeekly(id){
  const d = load(), t = rec(d, todayKey());
  if (!t[id] && weekDone(d, weekKeyOf(logicalNow()), id)) { render('✅ Ya lo hiciste esta semana', true); return; }
  update(d => {
    const t = today(d);
    t[id] = !t[id];
    return t[id] ? H[id].icon + ' ¡Misión semanal completada! +' + H[id].xp + ' XP' : 'Misión desmarcada';
  });
}
function addGlass(){
  const left = cooldownLeft(rec(load(), todayKey()));
  if (left > 0) { render('⏳ Próximo vaso en ' + Math.ceil(left/60000) + ' min', true); return; }
  update(d => {
    const t = today(d), was = complete(t);
    t.glasses = t.glasses || [];
    if (t.glasses.length >= MAX_GLASSES) return false;
    t.glasses.push(Date.now());
    if (!was && complete(t)) return PERFECT_MSG;
    return '💧 ¡Glup! Mimo agradece la hidratación.';

function undoGlass(){

  });
}

function saveSteps(){

    t.sg = t.sg || settingsOf(d).stepGoal;

async function saveSettings(btn){

  if (!Object.values(on).some(Boolean)) { err.textContent = 'Deja al menos un hábito activado.'; return; }
  const goal = clamp(Math.round((parseInt(document.getElementById('goalIn').value, 10) || 8000) / 500) * 500, 1000, 50000);
  const prev = settingsOf(load());
  let notify = prev.notify, turnedOn = false;

    d.nameU = Date.now();
    const t = today(d);
    t.h = activeIds(settingsOf(d));
    t.sg = goal;
    return '⚙️ Hábitos guardados';
  });
}

/* ---------- resumen del día anterior ---------- */
function summaryKey(){ return 'mimo-summary-' + (user ? user.id : 'local'); }
function maybeShowSummary(){
  const d = load(), tk = todayKey(), yk = keyOf(addDays(logicalNow(), -1));
  let seen = null;
  try { seen = localStorage.getItem(summaryKey()); } catch(e) {}
  if (seen === yk) return;
  const first = Object.keys(d.days).sort()[0];
  if (!first || first >= tk) return;                     // empezó hoy: no hay "ayer" que resumir
  if (document.getElementById('modal').classList.contains('open')) { setTimeout(maybeShowSummary, 3000); return; }
  try { localStorage.setItem(summaryKey(), yk); } catch(e) {}
  showSummary(d, yk, tk);
}
function showSummary(d, yk, tk){

  const ydt = parseKey(yk), wk = weekKeyOf(ydt), sunday = ydt.getDay() === 0;
  // racha al acabar ayer
  let st = 0, dt = ydt;
  while (d.days[keyOf(dt)] && complete(d.days[keyOf(dt)])) { st++; dt = addDays(dt, -1); }
  // dragón: daño de la semana hasta ayer
  const hp = bossHP(d);
  const dmgUntil = k => weekDays(wk).filter(x => x <= k).reduce((s, x) => s + (d.days[x] ? dayDmg(d.days[x]) : 0), 0);
  const dmgY = d.days[yk] ? dayDmg(y) : 0, dmgAfter = dmgUntil(yk), dmgBefore = dmgAfter - dmgY;
  const bossKilledYesterday = dmgBefore < hp && dmgAfter >= hp;
  const bathMissed = sunday && weeklyIds(y).filter(id => !weekDone(d, wk, id));
  const missing = ids.filter(id => !isDone(id, y)).map(id => H[id].name.toLowerCase());

  const r = total ? done / total : 0;
  let mood, title, msg;
  if (r >= 1)        { mood = 'happy';  title = '¡Día perfecto! 🌟';   msg = 'Mimo está feliz. ¡Sigue así!'; }
  else if (r >= 0.8) { mood = 'happy';  title = '¡Muy buen día!';      msg = 'Casi perfecto. Hoy puedes completarlo todo.'; }
  else if (r >= 0.5) { mood = 'normal'; title = 'Día correcto';        msg = 'Mimo está bien, pero hoy puedes hacerlo mejor.'; }
  else if (done > 0) { mood = 'sad';    title = 'Ayer fue flojo';      msg = 'Mimo te necesita hoy. ¡A por ello!'; }
  else               { mood = 'sad';    title = 'Ayer no cuidaste a Mimo'; msg = 'Mimo te ha echado de menos. Hoy es un buen día para volver.'; }

  const events = [];
  if (after.drops > before.drops) events.push(`<div class="ev bad">💔 Mimo se quedó sin energía y volvió a la etapa «${STAGES[after.stage]}».</div>`);
  else if (after.stage > before.stage) events.push(`<div class="ev good">✨ ¡Mimo ha evolucionado a «${STAGES[after.stage]}»!</div>`);
  if (bossKilledYesterday) events.push(`<div class="ev good">⚔️ ¡Derrotaste al Dragón de la Placa! +${XP_BOSS} XP</div>`);
  if (bathMissed && bathMissed.length) events.push(`<div class="ev bad">🛁 La semana acabó sin fregar el baño: −${ENERGY_WEEKLY} de energía.</div>`);
  if (st >= 2 && r >= 1) events.push(`<div class="ev good">🔥 ¡Llevas ${st} días perfectos seguidos!</div>`);

  const eAfter = clamp(after.energy, 0, 100), eBefore = clamp(before.energy, 0, 100);
  const eShown = after.drops > before.drops ? `${eBefore} → 0 → ${eAfter}` : `${eBefore} → ${eAfter}`;
  const sign = n => (n > 0 ? '+' : '') + n;
  const bossLine = sunday
    ? (dmgAfter >= hp ? 'Semana terminada: dragón derrotado ✓' : `Semana terminada: el dragón sobrevivió con ${hp - dmgAfter} HP`)
    : (dmgAfter >= hp ? `${dmgY} de daño · ya está derrotado ✓` : `${dmgY} de daño · le quedan ${hp - dmgAfter} HP`);

  openModal(`<div class="c">
      <div class="mut small">Resumen de ayer</div>
      <div class="pet ask-pet ${mood === 'sad' ? 'sad' : ''}">${mimoSVG(after.stage, mood)}</div>
      <h3>${title}</h3>
      <p class="mut small">${msg}</p>
    </div>
    ${events.join('')}
    <div class="sumlist">
      <div><span>✅ Misiones</span><b>${done} de ${total} · +${dayXP(y)} XP</b></div>
      <div><span>⚡ Energía</span><b>${eShown}${after.drops > before.drops ? '' : ' (' + sign(eAfter - eBefore) + ')'}</b></div>
      <div><span>🔥 Racha</span><b>${st} ${st === 1 ? 'día' : 'días'}</b></div>
      <div><span>🐉 Dragón</span><b>${bossLine}</b></div>
    </div>
    ${missing.length ? `<p class="small missing">Lo que faltó: ${missing.join(', ')}</p>` : ''}
    <div class="btns" style="margin-top:12px"><button class="sm pri" onclick="closeModal()">¡A por hoy!</button></div>`);
}

/* ---------- notificaciones push ---------- */
function pushSupported(){
  return !!(CFG.vapidPublicKey && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window);
}
function notifySettingsHtml(s){
  const head = '<div class="sep" style="margin-top:14px">Notificaciones</div>';
  if (!(cloud && user)) return head + '<p class="mut small" style="margin:8px 2px">Inicia sesión para recibir avisos.</p>';
  if (!pushSupported()) return head + '<p class="mut small" style="margin:8px 2px">Este navegador no permite notificaciones. Instala Mimo desde Chrome.</p>';
  const perm = Notification.permission;
  const hours = [-1, 18, 19, 20, 21, 22, 23].map(h => `<option value="${h}" ${Number(s.notify.hour) === h ? 'selected' : ''}>${h < 0 ? 'Nunca' : h + ':00'}</option>`).join('');
  return head + `
    <label class="opt"><span>🔔 Recibir avisos en este móvil</span><input type="checkbox" id="nOn" ${s.notify.on && perm === 'granted' ? 'checked' : ''}></label>
    <label class="opt"><span>⏰ Avisar 1 hora antes de que acabe un plazo</span><input type="checkbox" id="nDl" ${s.notify.deadline ? 'checked' : ''}></label>
    <label class="opt"><span>🌙 Recordarme lo pendiente a las</span><select id="nHour" class="field sm-field">${hours}</select></label>
    ${perm === 'denied' ? '<p class="login-err" style="margin:8px 0 0">Has bloqueado las notificaciones de Mimo. Actívalas en Ajustes de Android → Apps → Mimo → Notificaciones.</p>' : ''}`;
}
function b64ToBytes(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(raw, c => c.charCodeAt(0));
}
/* Pide permiso, suscribe este móvil y lo guarda en Supabase. Devuelve true o un mensaje de error. */
async function enablePush(silent){
  try {
    const perm = silent ? Notification.permission : await Notification.requestPermission();
    if (perm !== 'granted') return 'No has dado permiso para las notificaciones. Si las bloqueaste, actívalas en Ajustes de Android → Apps → Mimo.';
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(CFG.vapidPublicKey) });
    const j = sub.toJSON();
    const { error } = await cloud.from('push_subscriptions')
      .upsert({ endpoint: j.endpoint, user_id: user.id, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
    if (error) throw error;
    return true;
  } catch (e) {
    console.warn('Mimo push:', e);
    return 'No se pudieron activar los avisos: ' + (e && e.message ? e.message : e);
  }
}
async function disablePush(){
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (!sub) return;
    if (cloud && user) await cloud.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    await sub.unsubscribe();
  } catch (e) { console.warn('Mimo push:', e); }
}
/* La primera vez que alguien inicia sesión en un móvil, se le pregunta si quiere avisos.
   Hace falta que pulse un botón: Chrome solo muestra el permiso tras un toque. */
function askKey(){ return 'mimo-notify-asked-' + (user ? user.id : ''); }
function askNotifications(){
  if (!(cloud && user) || !pushSupported()) return;
  if (Notification.permission === 'denied' || settingsOf(load()).notify.on) return;
  try { if (localStorage.getItem(askKey())) return; } catch(e) {}
  if (document.getElementById('modal').classList.contains('open')) { setTimeout(askNotifications, 3000); return; }
  openModal(`<div class="c">
      <div class="pet ask-pet">${mimoSVG(Math.max(1, simulate(load()).stage), 'happy')}</div>
      <h3>¿Te aviso para que no se te olvide?</h3>
      <p class="mut small">Mimo te mandará una notificación 1 hora antes de que acabe el plazo de una misión y un recordatorio a las 22:00 con lo que te falte. Nunca entre las 0:00 y las 7:00.</p>
    </div>
    <div id="askErr" class="login-err" style="margin:0 0 10px"></div>
    <div class="btns"><button class="sm" onclick="declineNotifications()">Ahora no</button><button class="sm pri" onclick="acceptNotifications(this)">Sí, avísame</button></div>
    <p class="mut small c" style="margin:12px 0 0">Puedes cambiarlo cuando quieras en Perfil → Mis hábitos.</p>`);
}
function markAsked(){ try { localStorage.setItem(askKey(), String(Date.now())); } catch(e) {} }
function declineNotifications(){ markAsked(); closeModal(); }
async function acceptNotifications(btn){
  btn.disabled = true; btn.textContent = 'Activando…';
  const r = await enablePush();
  markAsked();
  if (r !== true) {
    document.getElementById('askErr').textContent = r;
    btn.disabled = false; btn.textContent = 'Reintentar';
    return;
  }
  closeModal();
  let tz;
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e) {}
  update(d => {
    const s = settingsOf(d);
    d.settings = { on: s.on, stepGoal: s.stepGoal, tz: tz || s.tz, notify: Object.assign({}, s.notify, { on: true }) };
    d.nameU = Date.now();
    return '🔔 Avisos activados';
  });
  testNotification();
}

async function testNotification(){
  try {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('🔔 Avisos activados', {
      body: 'Así te avisará Mimo cuando se acabe un plazo o te quede algo por hacer.',

/* ---------- datos derivados ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function build(d){
  const t = rec(d, todayKey());
  const xp = totalXP(d);
  const wk = weekKeyOf(logicalNow());
  const dmg = weekDmg(d, wk);
  const hp = bossHP(d);
  const st = streak(d);
  const sim = simulate(d);
  const doneCount = doneDaily(t), total = dailyIds(t).length;
  const mood = sim.energy < 35 ? 'sad' : (total && doneCount === total ? 'happy' : 'normal');
  return {
    t, xp, level: Math.floor(xp/100) + 1, into: xp % 100, wk, dmg, hp,
    hpLeft: Math.max(0, hp - dmg), bossDown: !!d.bossDefeated[wk],
    st, best: Math.max(d.bestStreak || 0, st),
    perfect: perfectDays(d), bossCount: Object.keys(d.bossDefeated).length,
    doneCount, total, sim, pet: mimoSVG(sim.stage, mood), stageName: STAGES[sim.stage],
    name: d.name || 'Jugador'
  };
}
/* Estado y texto corto de cada misión para las casillas y la lista */
function info(id, d, t){
  const h = H[id];
  switch (h.kind) {
    case 'brush': case 'check': {
      const st = mState(h, t);
      const sub = st === 'done' ? 'Hecho ✓' : st === 'soon' ? 'Desde ' + fmtH(h.from) : st === 'lost' ? 'Perdida' : (h.to ? 'Hasta ' + fmtH(h.to) : 'Pendiente');
      return { st, sub };
    }
    case 'water': {
      const n = glassCount(t);
      if (n >= GLASSES_GOAL) return { st:'done', sub: n + '/' + GLASSES_GOAL + ' ✓' };
      const left = cooldownLeft(t);
      return left > 0 ? { st:'wait', sub:'⏳ ' + Math.ceil(left/60000) + ' min' } : { st:'open', sub: n + '/' + GLASSES_GOAL + ' vasos' };
    }
    case 'steps': {
      const g = stepGoalOf(d, t), s = t.steps || 0;
      return { st: s >= g ? 'done' : 'open', sub: fmtK(s) + ' / ' + fmtK(g) };
    }
    case 'read': {
      if (t.read) return { st:'done', sub:'Hecho ✓' };
      if (!t.readStart) return { st:'open', sub:'Empezar' };
      const left = t.readStart + READ_MIN*60000 - Date.now();
      return left > 0 ? { st:'wait', sub:'Leyendo · ' + Math.ceil(left/60000) + ' min' } : { st:'open', sub:'Confirmar' };
    }
    case 'weekly': {
      const wd = weekDone(d, weekKeyOf(logicalNow()), id);
      return { st: wd ? 'done' : 'open', sub: wd ? 'Semana ✓' : 'Esta semana' };
    }
  }
}

/* ---------- pantallas ---------- */
function screenChar(d, c){
  const t = c.t, s = c.sim;
  const yesterday = keyOf(addDays(logicalNow(), -1));
  let mood, bad = false;
  if (s.lastDrop === yesterday) { mood = 'Ayer Mimo se quedó sin energía y volvió a la etapa «' + c.stageName + '».'; bad = true; }
  else if (s.energy < 35) { mood = 'Mimo está agotado. Completa las misiones de hoy para que se recupere.'; bad = true; }
  else if (c.total && c.doneCount === c.total) mood = '¡Mimo está radiante!';
  else if (c.doneCount === 0) mood = 'Mimo te espera. ¡Empieza el día!';
  else mood = 'Faltan ' + (c.total - c.doneCount) + ' misiones para completar el día.';

  const petCls = s.energy < 35 ? 'sad' : (c.total && c.doneCount === c.total ? 'glow' : '');
  const ids = hList(t);
  const tiles = ids.map(id => {
    const h = H[id], i = info(id, d, t);
    return `<button class="tile ${i.st}" onclick="act('${id}')"><span class="ti">${h.icon}</span><b>${h.name}</b><small>${i.sub}</small></button>`;
  }).join('');
  const eColor = s.energy < 35 ? 'var(--red)' : s.energy < 65 ? 'var(--gold)' : 'var(--acc)';
  const evo = c.sim.stage === PETS.length-1 ? 'Etapa máxima' : `${s.prog} / ${STAGE_XP} para evolucionar`;
  return `
    <div class="stage"><span class="tag">${c.stageName}</span><div class="pet ${petCls}">${c.pet}</div></div>
    <div class="mood ${bad?'bad':''}">${mood}</div>
    <div class="card">
      <div class="label"><b>⚡ Energía</b><span>${s.energy} / 100</span></div>
      <div class="bar"><i style="width:${Math.max(0, s.energy)}%;background:${eColor}"></i></div>

    </div>
    <div class="grid ${ids.length <= 4 ? 'g2' : ''}">${tiles}</div>`;
}

function missionRow(id, d, t){
  const h = H[id], i = info(id, d, t);
  let desc = i.sub, extra = '', reward = '+' + h.xp + ' XP';
  if (h.kind === 'brush' || (h.kind === 'check' && h.from !== undefined)) desc = fmtH(h.from) + ' – ' + fmtH(h.to) + (i.st === 'lost' ? ' · Perdida' : i.st === 'soon' ? ' · Aún no' : '');
  if (h.kind === 'check' && h.from === undefined) desc = i.st === 'done' ? 'Hecho ✓' : 'Cuando quieras';
  if (h.kind === 'water') {
    desc = waterMl(t) + ' / ' + WATER_GOAL + ' ml' + (i.st === 'wait' ? ' · ' + i.sub : '');
    reward = '+' + XP_GLASS + '/vaso';
    extra = `<span class="mini-btns"><button onclick="event.stopPropagation();undoGlass()" aria-label="Quitar un vaso">−</button><button onclick="event.stopPropagation();addGlass()" aria-label="Añadir un vaso">+</button></span>`;
  }
  if (h.kind === 'steps') desc = fmtNum(t.steps || 0) + ' / ' + fmtNum(stepGoalOf(d, t)) + ' pasos · toca para apuntar';
  if (h.kind === 'read') {
    desc = t.read ? 'Hecho ✓' : !t.readStart ? 'Toca para empezar a leer' : i.sub === 'Confirmar' ? 'Toca para confirmar' : i.sub;
    if (t.readStart || t.read) extra = `<button class="link" onclick="event.stopPropagation();cancelRead()">Reiniciar</button>`;
  }
  if (h.kind === 'weekly') desc = 'Una vez por semana · ' + (i.st === 'done' ? 'hecho ✓' : 'pendiente');
  return `<div class="quest ${i.st}" role="button" tabindex="0" onclick="act('${id}')">
      <span class="qi">${h.icon}</span>
      <span class="qt">${h.full}<small>${desc}</small></span>
      ${extra}
      <span class="rw">${reward}</span>
      <span class="check">${i.st==='done'?'✓':i.st==='lost'?'✕':''}</span>
    </div>`;
}

/* ---------- ranking con grupos ---------- */
let rk = { view:'group', groups:null, sel:null, rows:null, loading:false, err:'', at:0, leaveConfirm:false };
async function loadRanking(force){
  if (!cloud || !user || rk.loading) return;
  if (!force && rk.groups && Date.now() - rk.at < 30000) return;
  rk.loading = true;
  try {
    const g = await cloud.from('groups').select('id,name,code,owner_id,created_at').order('created_at');
    if (g.error) throw g.error;
    rk.groups = g.data || [];
    if (!rk.groups.find(x => x.id === rk.sel)) rk.sel = rk.groups.length ? rk.groups[0].id : null;
    if (rk.sel) {
      const r = await cloud.rpc('group_ranking', { g: rk.sel });
      if (r.error) throw r.error;
      rk.rows = r.data || [];
    } else rk.rows = [];
    rk.err = ''; rk.at = Date.now();
  } catch (e) {
    console.warn('Mimo ranking:', e);
    rk.err = navigator.onLine ? 'No se pudo cargar el ranking.' : 'Sin conexión. El ranking necesita internet.';
  }
  rk.loading = false;
  if (tab === 'rank') render();
}
function rkView(v){ rk.view = v; render(); if (v === 'group') loadRanking(); }
function selectGroup(id){ rk.sel = id; rk.rows = null; rk.leaveConfirm = false; render(); loadRanking(true); }
function curGroup(){ return (rk.groups || []).find(g => g.id === rk.sel); }
function rpcError(e){ return (e && e.message) ? e.message.replace(/^.*?:\s*/, '') : 'Algo ha fallado'; }
function openCreateGroup(){
  openModal(`<h3>👥 Crear grupo</h3>

async function joinGroup(code){

async function shareGroup(){
  const g = curGroup();
  if (!g) return;
  const url = location.origin + location.pathname + '?join=' + g.code;
  const text = 'Únete a mi grupo «' + g.name + '» en Mimo. Código: ' + g.code;
  try {
    if (navigator.share) { await navigator.share({ title:'Mimo', text, url }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text + '\n' + url); render('📋 Enlace copiado. Pégalo a tus amigos.'); }
  catch (e) { render('Código del grupo: ' + g.code, true); }
}
async function leaveGroup(){
  if (!rk.leaveConfirm) { rk.leaveConfirm = true; render(); return; }
  rk.leaveConfirm = false;
  const { error } = await cloud.from('group_members').delete().eq('group_id', rk.sel).eq('user_id', user.id);
  if (error) { render('No se pudo salir del grupo', true); return; }
  rk.sel = null; rk.groups = null;
  render('Has salido del grupo');
  loadRanking(true);
}
function groupView(){
  const actions = `<div class="btns2"><button class="btn-out" onclick="openCreateGroup()">➕ Crear grupo</button><button class="btn-out" onclick="openJoinGroup()">🔑 Unirme</button></div>`;
  if (rk.err && !rk.groups) return `<div class="card c grow empty"><p>${esc(rk.err)}</p><button class="sm" onclick="loadRanking(true)">Reintentar</button></div>`;
  if (!rk.groups) { setTimeout(() => loadRanking(), 0); return `<div class="card c grow empty"><p class="mut">Cargando ranking…</p></div>`; }
  if (!rk.groups.length) return `
    <div class="card c grow empty">
      <div style="font-size:54px">👥</div>
      <h3 style="margin:6px 0">Compite con tus amigos</h3>
      <p class="mut small">Crea un grupo y comparte el código, o únete al grupo de alguien. Veréis quién consigue más XP cada semana.</p>
    </div>${actions}`;
  const g = curGroup();
  const chips = rk.groups.length > 1
    ? `<div class="chips">${rk.groups.map(x => `<button class="${x.id === rk.sel ? 'on' : ''}" onclick="selectGroup('${x.id}')">${esc(x.name)}</button>`).join('')}</div>` : '';
  const medals = ['🥇','🥈','🥉'];
  const rows = (rk.rows || []).map((r, i) => {
    const me = r.user_id === user.id;
    return `<div class="rrow ${me ? 'me' : ''}">
      <span class="pos">${medals[i] || (i + 1)}</span>
      <span class="rpet">${mimoSVG(r.stage || 0, 'normal')}</span>
      <span class="rname"><b>${esc(r.display_name)}${me ? ' <i>(tú)</i>' : ''}</b><small>🔥 ${r.streak} días · ${STAGES[r.stage || 0]}</small></span>
      <span class="rxp">${r.week_xp}<small>XP</small></span>
    </div>`;
  }).join('');
  return `${chips}
    <div class="card gh">
      <div><b>${esc(g.name)}</b><span class="mut small">${(rk.rows || []).length} miembros · XP de esta semana</span></div>
      <button class="codebtn" onclick="shareGroup()" aria-label="Compartir código">${g.code} ↗</button>
    </div>
    <div class="card rlist grow">${rows || '<p class="mut c">Cargando…</p>'}</div>
    <div class="btns3"><button class="btn-out" onclick="openCreateGroup()">➕ Crear</button><button class="btn-out" onclick="openJoinGroup()">🔑 Unirme</button><button class="btn-out leave" onclick="leaveGroup()">${rk.leaveConfirm ? '¿Seguro?' : 'Salir'}</button></div>`;
}

function screenRank(d, c){
  const online = cloud && user;
  const seg = online ? `<div class="seg"><button class="${rk.view === 'group' ? 'on' : ''}" onclick="rkView('group')">👥 Grupo</button><button class="${rk.view === 'me' ? 'on' : ''}" onclick="rkView('me')">📈 Yo</button></div>` : '';
  if (online && rk.view === 'group') return seg + groupView();
  return seg + screenRankMe(d, c);
}

function screenRankMe(d, c){
  const weeks = [];
  for (let i = 4; i >= 0; i--){
    const wk = weekKeyOf(addDays(logicalNow(), -7*i));
    weeks.push({ wk, xp: weekXP(d, wk), cur: i === 0 });
  }
  const max = Math.max(1, ...weeks.map(w => w.xp));
  const cols = weeks.map(w => {
    const dt = parseKey(w.wk);
    return `<div class="col ${w.cur?'cur':''}">
      <b>${w.xp}</b>
      <div style="flex:1;width:100%;display:flex;align-items:flex-end"><div class="b" style="height:${w.xp/max*100}%"></div></div>
      <span>${dt.getDate()}/${dt.getMonth()+1}</span>
    </div>`;
  }).join('');
  const record = Math.max(...weeks.map(w => w.xp));
  let perf = 0, missions = 0, glasses = 0;
  for (const k of weekDays(c.wk)) {
    const r = d.days[k];
    if (!r) continue;
    if (complete(r)) perf++;
    missions += doneDaily(r) + weeklyIds(r).filter(id => r[id]).length;
    glasses += glassCount(r);
  }
  return `
    <h2>XP por semana</h2>
    <div class="card grow chart"><div class="cols">${cols}</div></div>
    <h2>Esta semana</h2>
    <div class="tri">
      <div class="card mini"><b>${perf}</b><span>días perfectos</span></div>
      <div class="card mini"><b>${missions}</b><span>misiones hechas</span></div>
      <div class="card mini"><b>${glasses}</b><span>vasos de agua</span></div>
    </div>
    <div class="card label"><b>Récord semanal (5 semanas)</b><span>${record} XP</span></div>
    ${cloud && user ? '' : '<div class="note">Inicia sesión para competir con tus amigos.</div>'}`;
}

function screenProfile(d, c){
  const badges = [
    ['🌱','Primer día perfecto', c.perfect >= 1],
    ['🔥','Racha de 7 días', c.best >= 7],
    ['💎','Racha de 30 días', c.best >= 30],
    ['⚔️','Primer jefe vencido', c.bossCount >= 1],
    ['🪽','Mimo alado', c.sim.stage >= 4]
  ].map(([i,n,ok]) => `<span class="${ok?'':'off'}">${i} ${n}</span>`).join('');
  const s = settingsOf(d), nOn = GROUPS.filter(g => s.on[g.key] !== false).length;
  return `
    <div class="card prof">
      <div class="pet sm">${c.pet}</div>
      <div style="flex:1">
        <div class="pname">${esc(c.name)}</div>
        <div class="mut small" style="margin-top:4px">Nivel ${c.level} · ${c.xp} XP · ${c.stageName}</div>
      </div>
    </div>
    <button class="card setbtn" onclick="openSettings()"><span>⚙️ Mis hábitos y objetivos</span><span class="mut small">${nOn} de ${GROUPS.length} activos ›</span></button>
    <h2>Insignias</h2>
    <div class="card badges">${badges}</div>
    <div class="tri statgrid grow">
      <div class="card mini"><b>${c.xp}</b><span>XP total</span></div>
      <div class="card mini"><b>${c.level}</b><span>nivel</span></div>
      <div class="card mini"><b>${c.best}</b><span>mejor racha</span></div>
      <div class="card mini"><b>${c.perfect}</b><span>días perfectos</span></div>
      <div class="card mini"><b>${c.bossCount}</b><span>jefes vencidos</span></div>
      <div class="card mini"><b>${c.sim.drops}</b><span>veces que bajó</span></div>
    </div>
    ${accountSection()}`;
}

/* ---------- nube: cuentas y sincronización (Supabase) ---------- */
const CFG = window.MIMO_CONFIG || {};
const cloud = (CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase)
  ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {
      auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    })
  : null;
let user = null, syncState = cloud ? 'syncing' : 'local', lastPull = 0;
let pushTimer = null, pushing = false, pushAgain = false;

const SYNC_TEXT = {
  local:   'Solo en este dispositivo',
  syncing: 'Sincronizando…',
  ok:      'Guardado en la nube ✓',
  error:   'Error al sincronizar, se reintentará',
  offline: 'Sin conexión, se guardará al volver'
};
function setSync(s){
  syncState = s;
  const el = document.getElementById('sync');
  if (el) { el.textContent = SYNC_TEXT[s]; el.className = 'sync ' + s; }
}

async function boot(){
  const d = load();
  if (ensureToday(d)) save(d);
  render();
  if (!cloud) { setTimeout(maybeShowSummary, 600); return; }
  const params = new URLSearchParams(location.search);
  const authError = params.get('error_description');
  const joinCode = params.get('join');
  if (joinCode) { try { localStorage.setItem('mimo-join', joinCode); } catch(e) {} }
  const { data } = await cloud.auth.getSession();
  if (location.search) history.replaceState(null, '', location.pathname);
  cloud.auth.onAuthStateChange((event, session) => {
    if (event === 'SIGNED_OUT') { user = null; showLogin(); }
    else if (event === 'SIGNED_IN' && session && !user) onSignedIn(session.user);
  });
  if (data && data.session) onSignedIn(data.session.user);
  else showLogin(authError ? 'No se pudo iniciar sesión: ' + authError : '');
}

function showLogin(msg = ''){
  const prov = CFG.providers || ['google'];
  const el = document.getElementById('login');
  el.innerHTML = `<div class="login-box">
    <div class="pet">${mimoSVG(0, 'normal')}</div>
    <h1>Mimo</h1>
    <p>Cuida a Mimo cuidando tus hábitos.</p>
    ${prov.includes('google') ? `<button class="auth google" onclick="signIn('google', this)">Continuar con Google</button>` : ''}
    ${prov.includes('apple') ? `<button class="auth apple" onclick="signIn('apple', this)">Continuar con Apple</button>` : ''}
    ${msg ? `<div class="login-err">${esc(msg)}</div>` : ''}
    <div class="note">Tu cuenta solo sirve para guardar tu progreso. Sin contraseñas.</div>
  </div>`;
  el.hidden = false;
}
function hideLogin(){ document.getElementById('login').hidden = true; }

async function signIn(provider, btn){
  if (btn) btn.disabled = true;
  const { error } = await cloud.auth.signInWithOAuth({
    provider, options: { redirectTo: location.origin + location.pathname }
  });
  if (error) showLogin('No se pudo iniciar sesión: ' + error.message);
}
async function signOut(){
  clearTimeout(pushTimer);
  if (pushSupported()) await disablePush();
  await pushNow();
  await cloud.auth.signOut();
  user = null;
  rk = { view:'group', groups:null, sel:null, rows:null, loading:false, err:'', at:0, leaveConfirm:false };
  save({ name:'Jugador', days:{}, bossDefeated:{}, bestStreak:0 });
  tab = 'char';
  render();
  showLogin();
}

async function onSignedIn(u){
  user = u;
  let d = load();
  if (d.uid && d.uid !== u.id) d = { name:'Jugador', days:{}, bossDefeated:{}, bestStreak:0 };
  d.uid = u.id;
  save(d);
  hideLogin();
  render();
  await pullAndMerge();
  let pendingJoin = null;
  try { pendingJoin = localStorage.getItem('mimo-join'); localStorage.removeItem('mimo-join'); } catch(e) {}
  if (pendingJoin) joinGroup(pendingJoin);
  maybeShowSummary();
  if (pushSupported() && settingsOf(load()).notify.on && Notification.permission === 'granted') enablePush(true);
  else setTimeout(askNotifications, 1200);
  cloud.from('profiles').update({ last_seen_at: new Date().toISOString() }).eq('id', u.id).then(() => {});
}

const EXTRA_KEYS = ['h','steps','sg','read','readStart','bed','kitchen','bath'];
function extraOf(r){
  const e = {};
  for (const k of EXTRA_KEYS) if (r[k] !== undefined && r[k] !== null) e[k] = r[k];
  return e;
}

/* Trae lo que hay en la nube y lo mezcla con lo local: gana lo más reciente. */
async function pullAndMerge(){
  if (!cloud || !user) return;
  lastPull = Date.now();
  setSync('syncing');
  try {
    const [p, logs, wins, prog] = await Promise.all([
      cloud.from('profiles').select('display_name,settings,updated_at').eq('id', user.id).maybeSingle(),
      cloud.from('day_logs').select('day,am,md,pm,glasses,extra,updated_at').eq('user_id', user.id),
      cloud.from('boss_wins').select('week_start').eq('user_id', user.id),
      cloud.from('progress').select('best_streak').eq('user_id', user.id).maybeSingle()
    ]);
    for (const r of [p, logs, wins, prog]) if (r.error) throw r.error;
    const d = load();
    if (p.data) {
      const su = Date.parse(p.data.updated_at);
      d.name = p.data.display_name;
      if (!d.nameU || d.nameU < su) {
        if (p.data.settings && Object.keys(p.data.settings).length) d.settings = p.data.settings;
        d.nameU = su; d.nameSyncedU = su;
      }
    }
    const server = {};
    for (const r of logs.data || []) server[r.day] = r;
    for (const k in server) {
      const r = server[k], su = Date.parse(r.updated_at), loc = d.days[k];
      if (!loc || (loc.u || 0) <= su) d.days[k] = Object.assign({ am:!!r.am, md:!!r.md, pm:!!r.pm, glasses:r.glasses || [] }, r.extra || {}, { u:su });
    }
    ensureToday(d);
    let minDirty = Infinity, maxU = 0;
    for (const k in d.days) {
      const r = d.days[k], s = server[k];
      if (!s || (r.u || 0) > Date.parse(s.updated_at)) { if (!r.u) r.u = Date.now(); minDirty = Math.min(minDirty, r.u); }
      maxU = Math.max(maxU, r.u || 0);
    }
    d.syncedAt = minDirty === Infinity ? maxU : minDirty - 1;
    for (const w of wins.data || []) d.bossDefeated[w.week_start] = true;
    if (prog.data) d.bestStreak = Math.max(d.bestStreak || 0, prog.data.best_streak || 0);
    save(d);
    render();
    await pushNow();
  } catch (e) {
    console.warn('Mimo sync (bajada):', e);
    setSync(navigator.onLine ? 'error' : 'offline');
  }
}

function schedulePush(){
  if (!cloud || !user) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 800);
}

/* Sube los días modificados, el perfil, los jefes y el resumen de progreso. */
async function pushNow(){
  if (!cloud || !user) return;
  if (pushing) { pushAgain = true; return; }
  if (!navigator.onLine) { setSync('offline'); return; }
  pushing = true;
  setSync('syncing');
  try {
    const d = load();
    const since = d.syncedAt || 0;
    let maxU = since;
    const rows = Object.keys(d.days).filter(k => (d.days[k].u || 0) > since).map(k => {
      const r = d.days[k];
      maxU = Math.max(maxU, r.u);
      return { user_id:user.id, day:k, am:!!r.am, md:!!r.md, pm:!!r.pm,
               glasses:(r.glasses || []).slice(0, MAX_GLASSES), extra:extraOf(r),
               updated_at:new Date(r.u).toISOString() };
    });
    if (rows.length) {
      const { error } = await cloud.from('day_logs').upsert(rows, { onConflict:'user_id,day' });
      if (error) throw error;
    }
    if ((d.nameU || 0) > (d.nameSyncedU || 0)) {
      const { error } = await cloud.from('profiles')
        .update({ settings:d.settings || {}, updated_at:new Date(d.nameU).toISOString() }).eq('id', user.id);
      if (error) throw error;
    }
    const wins = Object.keys(d.bossDefeated).map(w => ({ user_id:user.id, week_start:w }));
    if (wins.length) {
      const { error } = await cloud.from('boss_wins').upsert(wins, { onConflict:'user_id,week_start', ignoreDuplicates:true });
      if (error) throw error;
    }
    const c = build(d);
    const { error } = await cloud.from('progress').upsert({
      user_id:user.id, xp:c.xp, level:c.level, stage:c.sim.stage, energy:clamp(c.sim.energy, 0, 100),
      streak:c.st, best_streak:c.best, perfect_days:c.perfect, bosses:c.bossCount,
      week_start:c.wk, week_xp:weekXP(d, c.wk), updated_at:new Date().toISOString()
    }, { onConflict:'user_id' });
    if (error) throw error;
    const d2 = load();
    d2.syncedAt = Math.max(d2.syncedAt || 0, maxU);
    d2.nameSyncedU = Math.max(d2.nameSyncedU || 0, d.nameU || 0);
    save(d2);
    setSync('ok');
    if (tab === 'rank' && rk.view === 'group') loadRanking(true);
  } catch (e) {
    console.warn('Mimo sync (subida):', e);
    setSync(navigator.onLine ? 'error' : 'offline');
  } finally {
    pushing = false;
    if (pushAgain) { pushAgain = false; schedulePush(); }
  }
}

function accountSection(){
  const resetBtn = `<button class="danger" onclick="resetData()">${confirmReset ? 'Pulsa otra vez para borrar todo' : 'Borrar progreso'}</button>`;
  if (!cloud || !user) {
    return `<h2>Datos</h2>${resetBtn}<div class="note">Los datos se guardan solo en este dispositivo.</div>`;
  }
  const provider = (user.app_metadata && user.app_metadata.provider) || '';
  const pname = { google:'Google', apple:'Apple' }[provider] || provider;
  return `<h2>Cuenta</h2>
    <div class="card acct">
      <div><b>${esc(user.email || 'Cuenta de ' + pname)}</b><span id="sync" class="sync ${syncState}">${SYNC_TEXT[syncState]}</span></div>
      <span class="mut small">${esc(pname)}</span>
    </div>
    <div class="btns2">
      <button class="btn-out" onclick="signOut()">Cerrar sesión</button>
      ${resetBtn.replace('class="danger"', 'class="danger" style="padding:12px"')}
    </div>`;
}

/* ---------- render ---------- */
let lastToast = { msg:'', warn:false, until:0 };
function render(msg = '', warn = false){
  if (msg) lastToast = { msg, warn, until: Date.now() + 2600 };
  else if (lastToast.until > Date.now()) { msg = lastToast.msg; warn = lastToast.warn; }
  const main = document.getElementById('main');
  const scroll = main.scrollTop;
  const d = load(), c = build(d);

  document.getElementById('top').innerHTML = `
    <span class="name">Nv ${c.level} · ${esc(c.name)}</span>
    <div class="xpbar"><i style="width:${c.into}%"></i></div>
    <span>${c.xp} XP</span>`;

  const screens = { char: screenChar, missions: screenMissions, boss: screenBoss, rank: screenRank, profile: screenProfile };
  main.className = 'fill';
  main.innerHTML = (msg ? `<div class="toast ${warn?'warn':''}">${esc(msg)}</div>` : '') + screens[tab](d, c);
  main.scrollTop = scroll;
  if (msg) setTimeout(() => { if (lastToast.until <= Date.now()) { const t = document.querySelector('.toast'); if (t) t.remove(); } }, lastToast.until - Date.now() + 20);

  document.getElementById('nav').innerHTML = TABS.map(x => `
    <button class="${x.center?'center':''} ${x.id===tab?'on':''}" onclick="go('${x.id}')">
      ${x.center ? `<span class="disc">${c.pet}</span>` : `<span class="i">${x.icon}</span>`}
      <span class="lbl">${x.label}</span>
    </button>`).join('');
}

boot();
setInterval(() => { if (tab === 'rank') loadRanking(); if (tab !== 'profile' && !document.querySelector('.toast') && !document.getElementById('modal').classList.contains('open')) render(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); if (!cloud || user) setTimeout(maybeShowSummary, 1500); if (user && Date.now() - lastPull > 60000) pullAndMerge(); } });
window.addEventListener('online', () => pushNow());

/* ---------- instalable como app (PWA) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}
</script>
